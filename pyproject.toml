[project]
name = "llmevals"
version = "0.1.0"
description = "Local lighteval wrappers for LM Studio-backed model evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "lighteval[litellm]==0.13.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
override-dependencies = [
  "nltk==3.10.2",
]
constraint-dependencies = [
  "aiohttp>=3.14.3",
  "gitpython>=3.1.58",
  "guardrails-ai!=0.10.1",
  "idna>=3.15",
  "mistralai!=2.4.6",
  "python-dotenv>=1.2.2",
  "setuptools>=83",
  "soupsieve>=2.8.4",
  "starlette>=1.3.1",
  "torch>=2.13.0",
  "urllib3>=2.7.0",
]
package = false
